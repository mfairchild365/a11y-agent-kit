<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture</title></head>
<body>
<main>
<h1>Fixture</h1>
<div id="host"></div>
</main>
<script>var r=document.getElementById("host").attachShadow({mode:"open"});r.innerHTML='<div role="tablist" id="w" aria-label="w"><button role="tab" tabindex="0">One</button><button role="tab" tabindex="-1">Two</button></div>';var t=[].slice.call(r.querySelectorAll("[role=tab]"));r.getElementById("w").addEventListener("keydown",function(e){var i=t.indexOf(r.activeElement);if(e.key==="ArrowRight"&&i<t.length-1){t[i].tabIndex=-1;t[i+1].tabIndex=0;t[i+1].focus()}if(e.key==="ArrowLeft"&&i>0){t[i].tabIndex=-1;t[i-1].tabIndex=0;t[i-1].focus()}})</script>
</body>
</html>
