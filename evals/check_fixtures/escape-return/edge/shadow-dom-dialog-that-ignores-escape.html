</main>
<script>var r=document.getElementById("host").attachShadow({mode:"open"});r.innerHTML='<button id="t" aria-haspopup="dialog">Open</button><div id="d" role="dialog" aria-modal="true" aria-label="d" hidden><button id="c">Close</button></div>';var T=r.getElementById("t"),D=r.getElementById("d");T.addEventListener("click",function(){D.hidden=false;r.getElementById("c").focus()});r.getElementById("c").addEventListener("click",function(){D.hidden=true;T.focus()});D.addEventListener("keydown",function(e){if(e.key==="Tab"){e.preventDefault();r.getElementById("c").focus()}})</script>
