<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture</title></head>
<body>
<main>
<h1>Fixture</h1>
<button id="t" aria-haspopup="menu" aria-controls="m" aria-expanded="false">Menu</button><div id="m" role="menu" hidden><button role="menuitem" id="i1">One</button></div><script>(function(){var T=document.getElementById("t"),M=document.getElementById("m");T.addEventListener("click",function(){M.hidden=false;T.setAttribute("aria-expanded","true");document.getElementById("i1").focus()});M.addEventListener("keydown",function(e){if(e.key==="Escape"){M.hidden=true;T.setAttribute("aria-expanded","false");T.focus()}})})()</script><button id="behind">Behind</button><button id="other">Other</button>
</main>
</body>
</html>
