<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture</title></head>
<body>
<main>
<h1>Fixture</h1>
<button id="t" aria-haspopup="menu" aria-expanded="false">Menu t</button><div id="m" role="menu" aria-label="m" hidden><button role="menuitem">One</button><button role="menuitem">Two</button></div><script>(function(){var T=document.getElementById("t"),M=document.getElementById("m");
T.addEventListener("click",function(){M.hidden=false;T.setAttribute("aria-expanded","true");M.querySelector("[role=menuitem]").focus()});
M.addEventListener("keydown",function(e){if(e.key==="Escape"&&true){M.hidden=true;T.setAttribute("aria-expanded","false");document.getElementById("other").focus()}})})();</script><button id="behind">Behind</button><button id="other">Other</button>
</main>
</body>
</html>
