<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture</title></head>
<body>
<main>
<h1>Fixture</h1>
<button id="first">First</button>
<div role="dialog" aria-modal="true" aria-label="Dialog"><button id="a">A</button><button id="b">B</button></div>
</main>
<script>document.addEventListener("keydown",function(e){if(e.key!=="Tab")return;var a=document.getElementById("a"),b=document.getElementById("b");if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}})</script>
</body>
</html>
