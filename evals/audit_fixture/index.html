<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class roster</title>
<!--
  Seeded fixture for the accessibility-reviewer agent. Every defect below is listed in
  expected.json with its WCAG SC, expected severity and report tier. Don't fix them: the
  point is that the audit finds exactly these, and nothing else. Keep this file and
  expected.json in sync.
-->
<style>
  body { font-family: system-ui, sans-serif; margin: 0; color: #1a1a1a; background: #fff; }
  header { background: #0b3d91; color: #fff; padding: 1rem 1.5rem; display: flex; align-items: center; gap: .75rem; }
  header h1 { margin: 0; font-size: 1.5rem; }
  main { padding: 1.5rem; }
  :focus-visible { outline: 3px solid #0b3d91; outline-offset: 2px; }

  .roster { list-style: none; padding: 0; margin: 0 0 1rem; display: flex; gap: .5rem; }
  .bubble { position: relative; display: inline-flex; align-items: center; justify-content: center;
    width: 2.5rem; height: 2.5rem; border-radius: 50%; background: #0b3d91; color: #fff; font-size: .875rem;
    border: 0; cursor: default; transition: transform .4s; }
  .bubble:hover { transform: scale(1.15); }          /* SEED: no prefers-reduced-motion block. A best practice: no severity. */
  button.bubble { cursor: pointer; }

  /* SEED (1.4.13): tooltip shows on hover only. No Escape, vanishes if the pointer moves onto it (0.5rem gap). */
  .tip { display: none; position: absolute; top: 3rem; left: 0; z-index: 2; white-space: nowrap;
    background: #1a1a1a; color: #fff; padding: .25rem .5rem; border-radius: 4px; font-size: .875rem; }
  .bubble:hover .tip { display: block; }

  .more { font-size: .75rem; padding: .25rem .5rem; border: 1px solid #146eb3; border-radius: 4px;
    background: #fff; color: #146eb3; cursor: pointer; }
  /* SEED: blue #146eb3 on grey #d9dada is 3.83:1 for 12px text. Only the hover and open state fails. */
  .more:hover, .more[aria-expanded="true"] { background: #d9dada; color: #146eb3; }

  /* SEED: fixed width wider than a 320px viewport, and long names don't wrap (1.4.10). */
  .dropdown { width: 26rem; border: 1px solid #767676; background: #fff; padding: .75rem; margin-top: .5rem; }
  .dropdown[hidden] { display: none; }
  .dropdown ul { list-style: none; padding: 0; margin: 0 0 .5rem; }   /* SEED: list-style:none without role="list" (Minor). */
  .dropdown li { white-space: nowrap; }
  .dropdown .top { display: flex; justify-content: space-between; align-items: center; }
  .close { border: 0; background: none; padding: .25rem; cursor: pointer; }

  .add { margin-top: 1rem; padding: .5rem 1rem; }
</style>
</head>
<body>
<header>
  <!-- DECOY: decorative icon, hidden from assistive tech. Correct. Must not be reported. -->
  <svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#fff"/></svg>
  <h1>Class roster</h1>
</header>

<main>
  <h2>Period 3</h2>

  <ul class="roster">
    <!-- SEED, two issues on the same three bubbles (instances: 3 each):
         2.1.1 (Critical): the bubbles aren't focusable, so keyboard users can't reach them or the names.
         1.4.13 (Moderate): the hover tooltip can't be dismissed and vanishes when the pointer moves onto it. -->
    <li><div class="bubble">AL<span class="tip">Ana Lee</span></div></li>
    <li><div class="bubble">SO<span class="tip">Sam Ortiz</span></div></li>
    <li><div class="bubble">PR<span class="tip">Priya Rao</span></div></li>
    <!-- SEED (2.5.3): visible label "JD", accessible name "John Doe". Voice control "click JD" fails. -->
    <li><button type="button" class="bubble" aria-label="John Doe" id="jd">JD</button></li>
    <li>
      <!-- SEED (1.4.3): the hover and open state fails contrast. -->
      <button type="button" class="more" id="more" aria-expanded="false" aria-controls="dd" aria-label="+5 more students">+5</button>
    </li>
  </ul>

  <div class="dropdown" id="dd" hidden>
    <div class="top">
      <h3>More students</h3>
      <!-- SEED (4.1.2): icon-only button with no accessible name. axe: button-name. -->
      <button type="button" class="close" id="close">
        <svg aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 16 16"><path d="M2 2l12 12M14 2L2 14" stroke="#1a1a1a" stroke-width="2"/></svg>
      </button>
    </div>
    <ul>
      <li>Alexandria Montgomery-Featherstonehaugh</li>
      <li>Benedict Cumberbatch-Winterbottom</li>
      <li>Chandrasekhar Venkataraghavan</li>
      <li>Dmitri Shostakovich-Rimsky-Korsakov</li>
      <li>Eleanor Fitzgerald-Montmorency</li>
    </ul>
  </div>

  <!-- SEED (4.1.3, unverifiable without a screen reader): the region is cleared and refilled in
       the same tick, so a screen reader may announce it twice or not at all. Confidence Low. -->
  <p id="status" aria-live="polite"></p>

  <!-- DECOY: a plain native button with a visible, matching label. Correct. Must not be reported. -->
  <button type="button" class="add">Add student</button>
</main>

<script>
  const more = document.getElementById('more'), dd = document.getElementById('dd'), status = document.getElementById('status');
  function setOpen(open) {
    dd.hidden = !open;
    more.setAttribute('aria-expanded', String(open));
    status.textContent = '';
    status.textContent = open ? 'Showing 5 more students' : 'Hidden';
    (open ? document.getElementById('close') : more).focus();
  }
  more.addEventListener('click', () => setOpen(dd.hidden));
  document.getElementById('close').addEventListener('click', () => setOpen(false));
</script>
</body>
</html>
